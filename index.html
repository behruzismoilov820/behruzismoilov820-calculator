<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulyator Ombori</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100vw;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #0f172a, #1e293b, #3b82f6);
            background-size: cover;
            background-attachment: fixed;
            color: #fff;
            position: relative;
            overflow-x: hidden;
        }

        /* Kalkulyator Qismi */
        .calc-container {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            width: 420px;
            max-width: 95vw;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        #display {
            width: 100%;
            height: 75px;
            background: #0f172a;
            color: #38bdf8;
            font-size: 36px;
            font-weight: bold;
            text-align: right;
            padding: 10px 20px;
            box-sizing: border-box;
            border: 2px solid rgba(56, 189, 248, 0.3);
            margin-bottom: 25px;
            border-radius: 16px;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }
        button {
            padding: 22px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 16px;
            background: #334155;
            color: #fff;
            transition: all 0.2s ease;
        }
        button:hover {
            background: #475569;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }
        button.operator { background: #f59e0b; color: white; }
        button.operator:hover { background: #d97706; }
        button.clear { background: #ef4444; color: white; }
        button.clear:hover { background: #dc2626; }

        /* Chap Tarafdagi Menyu Tugmasi */
        .menu-btn {
            display: none;
            position: fixed;
            top: 20px;
            left: 20px;
            background: #38bdf8;
            color: #0f172a;
            border: none;
            font-size: 20px;
            padding: 12px 20px;
            border-radius: 12px;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            font-weight: bold;
            transition: transform 0.2s;
        }
        .menu-btn:hover {
            transform: scale(1.05);
        }

        /* Tepadan Pastga Tushuvchi Menyu Paneli */
        .sidebar-menu {
            position: fixed;
            top: -100%;
            left: 20px;
            width: 320px;
            max-width: calc(100vw - 40px);
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: top 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 999;
        }
        .sidebar-menu.active {
            top: 80px;
        }

        .sidebar-menu h2 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #4ade80;
            text-align: center;
            font-size: 22px;
        }

        /* Havolalarning Maydonni To'liq Egallashi */
        .app-link {
            display: block;
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .app-link:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }

        .lock-btn {
            background: #ef4444;
            color: white;
            padding: 14px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            width: 100%;
            margin-top: 10px;
        }

        .counter-footer {
            margin-top: 30px;
            opacity: 0.85;
        }
    </style>
</head>
<body>

    <!-- Chap Yuqoridagi Menyu Tugmasi -->
    <button class="menu-btn" id="menuToggleBtn" onclick="toggleMenu()">☰ Menyu</button>

    <!-- Tepadan Tushib Keladigan Menyu (Ombor) -->
    <div class="sidebar-menu" id="sidebarMenu">
        <h2>🔒 Yashirin Ombor</h2>
        <a href="https://google.com" target="_blank" class="app-link">Google</a>
        <a href="https://youtube.com" target="_blank" class="app-link">YouTube</a>
        <a href="https://github.com" target="_blank" class="app-link">GitHub</a>
        <a href="https://instagram.com" target="_blank" class="app-link" style="background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);">Instagram</a>
        <a href="https://yandex.com/games" target="_blank" class="app-link" style="background: #fc3f1d;">Yandex Games</a>
        <a href="https://play-cs.com/" target="_blank" class="app-link" style="background: #10b981;">CS 1.6 Web</a>
        <button onclick="lockVault()" class="lock-btn">Qulflash</button>
    </div>

    <!-- Kalkulyator Qismi -->
    <div class="calc-container" id="calculator">
        <input type="text" id="display" readonly placeholder="0">
        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">C</button>
            <button onclick="press('/')">/</button>
            <button onclick="press('*')">*</button>
            <button class="operator" onclick="press('-')">-</button>
            
            <button onclick="press('7')">7</button>
            <button onclick="press('8')">8</button>
            <button onclick="press('9')">9</button>
            <button class="operator" onclick="press('+')">+</button>
            
            <button onclick="press('4')">4</button>
            <button onclick="press('5')">5</button>
            <button onclick="press('6')">6</button>
            <button class="operator" onclick="calculate()">=</button>
            
            <button onclick="press('1')">1</button>
            <button onclick="press('2')">2</button>
            <button onclick="press('3')">3</button>
            <button onclick="press('0')">0</button>
        </div>
    </div>

    <!-- Tashriflar Nishoni -->
    <div class="counter-footer">
        <img src="https://komarev.com/ghpvc/?username=behruzismoilov820-calcualtor&label=Tashriflar&color=blue&style=flat" alt="Tashriflar soni">
    </div>

    <script>
        // HOXLAGAN PAROLINGIZNI SHU YERGA YOZING:
        const USER_PASSWORD = "1995"; 

        let display = document.getElementById('display');
        let menuBtn = document.getElementById('menuToggleBtn');
        let sidebarMenu = document.getElementById('sidebarMenu');

        function press(val) {
            display.value += val;
        }

        function clearDisplay() {
            display.value = "";
        }

        function calculate() {
            if (display.value === USER_PASSWORD) {
                menuBtn.style.display = 'block';
                sidebarMenu.classList.add('active');
                clearDisplay();
                return;
            }
            
            try {
                display.value = eval(display.value);
            } catch (e) {
                display.value = "Xato";
            }
        }

        function toggleMenu() {
            sidebarMenu.classList.toggle('active');
        }

        function lockVault() {
            sidebarMenu.classList.remove('active');
            menuBtn.style.display = 'none';
        }
    </script>
</body>
</html>
