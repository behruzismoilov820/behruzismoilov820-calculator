<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulyator Ombori</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100vw;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #0f172a, #1e293b, #3b82f6);
            background-size: cover;
            background-attachment: fixed;
            color: #fff;
        }

        /* Kalkulyator Qismi */
        .calc-container {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(15px);
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            width: 400px;
            max-width: 90vw;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        #display {
            width: 100%;
            height: 70px;
            background: #0f172a;
            color: #38bdf8;
            font-size: 34px;
            font-weight: bold;
            text-align: right;
            padding: 10px 20px;
            box-sizing: border-box;
            border: 2px solid rgba(56, 189, 248, 0.3);
            margin-bottom: 25px;
            border-radius: 16px;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }
        button {
            padding: 20px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 16px;
            background: #334155;
            color: #fff;
            transition: all 0.2s ease;
        }
        button:hover {
            background: #475569;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }
        button.operator { background: #f59e0b; color: white; }
        button.operator:hover { background: #d97706; }
        button.clear { background: #ef4444; color: white; }
        button.clear:hover { background: #dc2626; }

        /* Yashirin Ombor Oynasi */
        .vault-wrapper {
            display: none;
            width: 95vw;
            height: 90vh;
            gap: 20px;
        }

        /* Chap Menyu */
        .vault-sidebar {
            width: 320px;
            min-width: 280px;
            height: 100%;
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(15px);
            padding: 25px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        .vault-sidebar h2 {
            margin-top: 0;
            color: #4ade80;
            font-size: 24px;
            text-align: center;
        }
        .app-btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin-bottom: 10px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-decoration: none;
        }
        .app-btn:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }

        /* O'ng Tomondagi Sayt/O'yin Oynasi */
        .vault-content {
            flex: 1;
            height: 100%;
            background: rgba(15, 23, 42, 0.9);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .vault-content iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }
        .placeholder-text {
            color: #94a3b8;
            font-size: 18px;
            text-align: center;
            padding: 20px;
        }

        .lock-btn {
            background: #ef4444;
            color: white;
            padding: 14px;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            width: 100%;
            margin-top: auto;
        }

        .counter-footer {
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Kalkulyator Qismi -->
    <div class="calc-container" id="calculator">
        <input type="text" id="display" readonly placeholder="0">
        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">C</button>
            <button onclick="press('/')">/</button>
            <button onclick="press('*')">*</button>
            <button class="operator" onclick="press('-')">-</button>
            
            <button onclick="press('7')">7</button>
            <button onclick="press('8')">8</button>
            <button onclick="press('9')">9</button>
            <button class="operator" onclick="press('+')">+</button>
            
            <button onclick="press('4')">4</button>
            <button onclick="press('5')">5</button>
            <button onclick="press('6')">6</button>
            <button class="operator" onclick="calculate()">=</button>
            
            <button onclick="press('1')">1</button>
            <button onclick="press('2')">2</button>
            <button onclick="press('3')">3</button>
            <button onclick="press('0')">0</button>
        </div>
        <div class="counter-footer">
            <img src="https://komarev.com/ghpvc/?username=behruzismoilov820-calcualtor&label=Tashriflar&color=blue&style=flat" alt="Tashriflar soni">
        </div>
    </div>

    <!-- Yashirin Ombor Oynasi -->
    <div class="vault-wrapper" id="vault">
        <!-- Chap Menyu -->
        <div class="vault-sidebar">
            <h2>🔒 Ombor</h2>
            
            <!-- O'ng tomondagi ekran ichida ochiladigan o'yinlar -->
            <button class="app-btn" style="background: #10b981;" onclick="openGame('https://play-cs.com/')">🎮 CS 1.6 Web (Ichkarida)</button>
            <button class="app-btn" style="background: #fc3f1d;" onclick="openGame('https://yandex.com/games')">🕹️ Yandex Games (Ichkarida)</button>
            
            <hr style="border: 0.5px solid rgba(255,255,255,0.1); width: 100%; margin: 15px 0;">

            <!-- Yangi oynada ochiladigan tashqi veb-saytlar -->
            <a href="https://google.com" target="_blank" class="app-btn" style="background: #2563eb;">🌐 Google</a>
            <a href="https://youtube.com" target="_blank" class="app-btn" style="background: #cc181e;">▶️ YouTube</a>
            <a href="https://github.com/behruzismoilov820" target="_blank" class="app-btn" style="background: #24292e;">🐙 GitHub</a>
            <a href="https://instagram.com" target="_blank" class="app-btn" style="background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);">📸 Instagram</a>
            
            <button onclick="lockVault()" class="lock-btn">Qulflash</button>
        </div>

        <!-- O'ng tomonda o'yin ochiladigan joy -->
        <div class="vault-content">
            <iframe id="gameViewer" src="" style="display:none;"></iframe>
            <div id="placeholder" class="placeholder-text">
                <h3>🎮 O'yinlarni tanlang</h3>
                <p>CS 1.6 Web yoki Yandex Games o'ng tomonda to'g'ridan-to'g'ri ochiladi!</p>
            </div>
        </div>
    </div>

    <script>
        const USER_PASSWORD = "1995"; 

        let display = document.getElementById('display');
        let calculator = document.getElementById('calculator');
        let vault = document.getElementById('vault');
        let gameViewer = document.getElementById('gameViewer');
        let placeholder = document.getElementById('placeholder');

        function press(val) {
            display.value += val;
        }

        function clearDisplay() {
            display.value = "";
        }

        function calculate() {
            if (display.value === USER_PASSWORD) {
                calculator.style.display = 'none';
                vault.style.display = 'flex';
                clearDisplay();
                // Ombor ochilganda avtomatik CS 1.6 ni o'ng tomonga yuklaydi
                openGame('https://play-cs.com/');
                return;
            }
            
            try {
                display.value = eval(display.value);
            } catch (e) {
                display.value = "Xato";
            }
        }

        function openGame(url) {
            placeholder.style.display = 'none';
            gameViewer.style.display = 'block';
            gameViewer.src = url;
        }

        function lockVault() {
            vault.style.display = 'none';
            calculator.style.display = 'block';
            gameViewer.src = "";
            gameViewer.style.display = 'none';
            placeholder.style.display = 'block';
            clearDisplay();
        }
    </script>
</body>
</html>
