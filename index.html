<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulyator Ombori</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* Chiroyli zamonaviy gradient fon */
            background: linear-gradient(135deg, #1e1e2f, #2b2b40);
            margin: 0;
            color: #fff;
        }
        .calc-container {
            background: rgba(43, 43, 60, 0.85);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 300px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        #display {
            width: 100%;
            height: 55px;
            background: #181824;
            color: #fff;
            font-size: 26px;
            text-align: right;
            padding: 10px;
            box-sizing: border-box;
            border: none;
            margin-bottom: 15px;
            border-radius: 8px;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        button {
            padding: 15px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background: #3a3a52;
            color: #fff;
            transition: 0.2s;
        }
        button:hover {
            background: #4a4a6a;
            transform: translateY(-2px);
        }
        button.operator { background: #ff9500; color: white; }
        button.operator:hover { background: #e08500; }
        button.clear { background: #ff3b30; color: white; }
        button.clear:hover { background: #e03229; }
        
        .vault-container {
            display: none;
            text-align: center;
            background: rgba(43, 43, 60, 0.9);
            backdrop-filter: blur(10px);
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 350px;
        }
        .vault-container h2 {
            margin-top: 0;
            color: #4cd137;
        }
        .app-icon {
            display: inline-block;
            margin: 8px;
            padding: 12px 18px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .app-icon:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }
        .counter-footer {
            margin-top: 25px;
            opacity: 0.8;
            transition: opacity 0.3s;
        }
        .counter-footer:hover {
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- Kalkulyator Qismi -->
    <div class="calc-container" id="calculator">
        <input type="text" id="display" readonly placeholder="0">
        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">C</button>
            <button onclick="press('/')">/</button>
            <button onclick="press('*')">*</button>
            <button class="operator" onclick="press('-')">-</button>
            
            <button onclick="press('7')">7</button>
            <button onclick="press('8')">8</button>
            <button onclick="press('9')">9</button>
            <button class="operator" onclick="press('+')">+</button>
            
            <button onclick="press('4')">4</button>
            <button onclick="press('5')">5</button>
            <button onclick="press('6')">6</button>
            <button class="operator" onclick="calculate()">=</button>
            
            <button onclick="press('1')">1</button>
            <button onclick="press('2')">2</button>
            <button onclick="press('3')">3</button>
            <button onclick="press('0')">0</button>
        </div>
    </div>

    <!-- Yashirin Ombor Qismi (Parol: 1995) -->
    <div class="vault-container" id="vault">
        <h2>🔒 Yashirin Ombor Ochildi!</h2>
        <p>Bu yerda maxsus ilovalar va havolalarni saqlashingiz mumkin:</p>
        <a href="https://google.com" target="_blank" class="app-icon">Google</a>
        <a href="https://youtube.com" target="_blank" class="app-icon">YouTube</a>
        <a href="https://github.com" target="_blank" class="app-icon">GitHub</a>
        <a href="https://instagram.com" target="_blank" class="app-icon" style="background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);">Instagram</a>
        <a href="https://yandex.com/games" target="_blank" class="app-icon" style="background: #fc3f1d;">Yandex Games</a>
        <a href="https://play-cs.com/" target="_blank" class="app-icon" style="background: #28a745;">CS 1.6 Web</a>
        <br><br>
        <button onclick="lockVault()" style="background: #ff3b30; color: white; padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold;">Qulflash</button>
    </div>

    <!-- Ortiqcha yozuvsiz faqat chiroyli tashriflar nishoni -->
    <div class="counter-footer">
        <img src="https://komarev.com/ghpvc/?username=behruzismoilov820-calcualtor&label=Tashriflar&color=blue&style=flat" alt="Tashriflar soni">
    </div>

    <script>
        let display = document.getElementById('display');
        const secretPassword = "1995"; 

        function press(val) {
            display.value += val;
        }

        function clearDisplay() {
            display.value = "";
        }

        function calculate() {
            if (display.value === secretPassword) {
                document.getElementById('calculator').style.display = 'none';
                document.getElementById('vault').style.display = 'block';
                clearDisplay();
                return;
            }
            
            try {
                display.value = eval(display.value);
            } catch (e) {
                display.value = "Xato";
            }
        }

        function lockVault() {
            document.getElementById('calculator').style.display = 'block';
            document.getElementById('vault').style.display = 'none';
        }
    </script>
</body>
</html>
