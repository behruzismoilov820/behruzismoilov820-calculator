<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulyator Ombori</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
        }
        .calc-container {
            background: #333;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            width: 280px;
        }
        #display {
            width: 100%;
            height: 50px;
            background: #fff;
            font-size: 24px;
            text-align: right;
            padding: 5px;
            box-sizing: border-box;
            border: none;
            margin-bottom: 15px;
            border-radius: 5px;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        button {
            padding: 15px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background: #e0e0e0;
        }
        button.operator { background: #ff9500; color: white; }
        button.clear { background: #ff3b30; color: white; }
        .vault-container {
            display: none;
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .app-icon {
            display: inline-block;
            margin: 10px;
            padding: 10px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        .counter-footer {
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- Kalkulyator Qismi -->
    <div class="calc-container" id="calculator">
        <input type="text" id="display" readonly placeholder="0">
        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">C</button>
            <button onclick="press('/')">/</button>
            <button onclick="press('*')">*</button>
            <button class="operator" onclick="press('-')">-</button>
            
            <button onclick="press('7')">7</button>
            <button onclick="press('8')">8</button>
            <button onclick="press('9')">9</button>
            <button class="operator" onclick="press('+')">+</button>
            
            <button onclick="press('4')">4</button>
            <button onclick="press('5')">5</button>
            <button onclick="press('6')">6</button>
            <button class="operator" onclick="calculate()">=</button>
            
            <button onclick="press('1')">1</button>
            <button onclick="press('2')">2</button>
            <button onclick="press('3')">3</button>
            <button onclick="press('0')">0</button>
        </div>
    </div>

    <!-- Yashirin Ombor Qismi (Parol: 1995) -->
    <div class="vault-container" id="vault">
        <h2>🔒 Yashirin Ombor Ochildi!</h2>
        <p>Bu yerda maxsus ilovalar va havolalarni saqlashingiz mumkin:</p>
        <a href="https://google.com" target="_blank" class="app-icon">Google</a>
        <a href="https://youtube.com" target="_blank" class="app-icon">YouTube</a>
        <a href="https://github.com" target="_blank" class="app-icon">GitHub</a>
        <br><br>
        <button onclick="lockVault()" style="background: #333; color: white; padding: 10px; border-radius: 5px; border: none; cursor: pointer;">Qulflash</button>
    </div>

    <!-- Ortiqcha yozuvsiz faqat chiroyli tashriflar nishoni -->
    <div class="counter-footer">
        <img src="https://komarev.com/ghpvc/?username=behruzismoilov820-calcualtor&label=Tashriflar&color=blue&style=flat" alt="Tashriflar soni">
    </div>

    <script>
        let display = document.getElementById('display');
        const secretPassword = "1995"; 

        function press(val) {
            display.value += val;
        }

        function clearDisplay() {
            display.value = "";
        }

        function calculate() {
            if (display.value === secretPassword) {
                document.getElementById('calculator').style.display = 'none';
                document.getElementById('vault').style.display = 'block';
                clearDisplay();
                return;
            }
            
            try {
                display.value = eval(display.value);
            } catch (e) {
                display.value = "Xato";
            }
        }

        function lockVault() {
            document.getElementById('calculator').style.display = 'block';
            document.getElementById('vault').style.display = 'none';
        }
    </script>
</body>
</html>
