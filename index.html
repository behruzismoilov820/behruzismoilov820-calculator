<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulyator Ombori</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100vw;
            margin: 0;
            padding: 20px;
            /* Chiroyli zamonaviy gradient fon */
            background: linear-gradient(135deg, #0f172a, #1e293b, #3b82f6);
            background-size: cover;
            background-attachment: fixed;
            color: #fff;
        }

        /* Kalkulyator qismi - Katta va keng qilib belgilandi */
        .calc-container {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            width: 420px;
            max-width: 95vw;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        #display {
            width: 100%;
            height: 75px;
            background: #0f172a;
            color: #38bdf8;
            font-size: 36px;
            font-weight: bold;
            text-align: right;
            padding: 10px 20px;
            box-sizing: border-box;
            border: 2px solid rgba(56, 189, 248, 0.3);
            margin-bottom: 25px;
            border-radius: 16px;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }
        button {
            padding: 22px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 16px;
            background: #334155;
            color: #fff;
            transition: all 0.2s ease;
        }
        button:hover {
            background: #475569;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }
        button.operator { background: #f59e0b; color: white; }
        button.operator:hover { background: #d97706; }
        button.clear { background: #ef4444; color: white; }
        button.clear:hover { background: #dc2626; }
        
        /* Yashirin ombor qismi */
        .vault-container {
            display: none;
            text-align: center;
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(12px);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            width: 450px;
            max-width: 95vw;
        }
        .vault-container h2 {
            margin-top: 0;
            color: #4ade80;
            font-size: 26px;
        }
        .app-icon {
            display: inline-block;
            margin: 10px;
            padding: 15px 25px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 14px;
            font-size: 18px;
            font-weight: bold;
            transition: all 0.2s ease;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        .app-icon:hover {
            transform: scale(1.08);
            opacity: 0.95;
        }
        .counter-footer {
            margin-top: 30px;
            opacity: 0.85;
        }
    </style>
</head>
<body>

    <!-- Kalkulyator Qismi -->
    <div class="calc-container" id="calculator">
        <input type="text" id="display" readonly placeholder="0">
        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">C</button>
            <button onclick="press('/')">/</button>
            <button onclick="press('*')">*</button>
            <button class="operator" onclick="press('-')">-</button>
            
            <button onclick="press('7')">7</button>
            <button onclick="press('8')">8</button>
            <button onclick="press('9')">9</button>
            <button class="operator" onclick="press('+')">+</button>
            
            <button onclick="press('4')">4</button>
            <button onclick="press('5')">5</button>
            <button onclick="press('6')">6</button>
            <button class="operator" onclick="calculate()">=</button>
            
            <button onclick="press('1')">1</button>
            <button onclick="press('2')">2</button>
            <button onclick="press('3')">3</button>
            <button onclick="press('0')">0</button>
        </div>
    </div>

    <!-- Yashirin Ombor Qismi (Parol: 1995) -->
    <div class="vault-container" id="vault">
        <h2>🔒 Yashirin Ombor Ochildi!</h2>
        <p style="font-size: 18px; margin-bottom: 20px;">Maxsus ilova va o'yinlar ro'yxati:</p>
        <a href="https://google.com" target="_blank" class="app-icon">Google</a>
        <a href="https://youtube.com" target="_blank" class="app-icon">YouTube</a>
        <a href="https://github.com" target="_blank" class="app-icon">GitHub</a>
        <a href="https://instagram.com" target="_blank" class="app-icon" style="background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);">Instagram</a>
        <a href="https://yandex.com/games" target="_blank" class="app-icon" style="background: #fc3f1d;">Yandex Games</a>
        <a href="https://play-cs.com/" target="_blank" class="app-icon" style="background: #10b981;">CS 1.6 Web</a>
        <br><br>
        <button onclick="lockVault()" style="background: #ef4444; color: white; padding: 15px; border-radius: 14px; border: none; cursor: pointer; font-weight: bold; font-size: 18px; width: 100%;">Qulflash</button>
    </div>

    <!-- Tashriflar nishoni -->
    <div class="counter-footer">
        <img src="https://komarev.com/ghpvc/?username=behruzismoilov820-calcualtor&label=Tashriflar&color=blue&style=flat" alt="Tashriflar soni">
    </div>

    <script>
        let display = document.getElementById('display');
        const secretPassword = "1995"; 

        function press(val) {
            display.value += val;
        }

        function clearDisplay() {
            display.value = "";
        }

        function calculate() {
            if (display.value === secretPassword) {
                document.getElementById('calculator').style.display = 'none';
                document.getElementById('vault').style.display = 'block';
                clearDisplay();
                return;
            }
            
            try {
                display.value = eval(display.value);
            } catch (e) {
                display.value = "Xato";
            }
        }

        function lockVault() {
            document.getElementById('calculator').style.display = 'block';
            document.getElementById('vault').style.display = 'none';
        }
    </script>
</body>
</html>
