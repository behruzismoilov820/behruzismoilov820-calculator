<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хранилище Калькулятора</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; width: 100vw; margin: 0; padding: 20px;
            background: linear-gradient(135deg, #0f172a, #1e293b, #3b82f6);
            color: #fff; overflow: hidden;
        }

        /* Калькулятор */
        .calc-container {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(15px);
            padding: 35px; border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            width: 400px; max-width: 90vw;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        #display {
            width: 100%; height: 70px; background: #0f172a;
            color: #38bdf8; font-size: 34px; font-weight: bold;
            text-align: right; padding: 10px 20px; border: 2px solid rgba(56, 189, 248, 0.3);
            margin-bottom: 25px; border-radius: 16px;
        }
        .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
        button {
            padding: 20px; font-size: 22px; font-weight: bold; cursor: pointer;
            border: none; border-radius: 16px; background: #334155; color: #fff;
            transition: all 0.2s ease;
        }
        button:hover { background: #475569; transform: translateY(-3px); }
        button.operator { background: #f59e0b; color: white; }
        button.clear { background: #ef4444; color: white; }

        /* Хранилище (Только меню) */
        .vault-wrapper {
            display: none;
            width: 420px; max-width: 90vw;
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(15px);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            flex-direction: column;
        }
        .vault-wrapper h2 { margin-top: 0; color: #4ade80; font-size: 26px; text-align: center; }
        .app-btn {
            display: block; width: 100%; padding: 15px; margin-bottom: 12px;
            background: #2563eb; color: white; border: none; border-radius: 14px;
            font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.2s ease;
            text-align: center; text-decoration: none;
        }
        .app-btn:hover { transform: translateY(-2px); opacity: 0.95; }
        .lock-btn {
            background: #ef4444; color: white; padding: 14px;
            border-radius: 14px; border: none; cursor: pointer;
            font-weight: bold; font-size: 16px; width: 100%; margin-top: 10px;
        }
        .counter-footer { margin-top: 20px; text-align: center; }
    </style>
</head>
<body>

    <!-- Калькулятор -->
    <div class="calc-container" id="calculator">
        <input type="text" id="display" readonly placeholder="0">
        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">C</button>
            <button onclick="press('/')">/</button>
            <button onclick="press('*')">*</button>
            <button class="operator" onclick="press('-')">-</button>
            
            <button onclick="press('7')">7</button>
            <button onclick="press('8')">8</button>
            <button onclick="press('9')">9</button>
            <button class="operator" onclick="press('+')">+</button>
            
            <button onclick="press('4')">4</button>
            <button onclick="press('5')">5</button>
            <button onclick="press('6')">6</button>
            <button class="operator" onclick="calculate()">=</button>
            
            <button onclick="press('1')">1</button>
            <button onclick="press('2')">2</button>
            <button onclick="press('3')">3</button>
            <button onclick="press('0')">0</button>
        </div>
        <div class="counter-footer">
            <img src="https://komarev.com/ghpvc/?username=behruzismoilov820-calcualtor&label=Visits&color=blue&style=flat" alt="Счетчик посещений">
        </div>
    </div>

    <!-- Хранилище (Все открывается в новых вкладках) -->
    <div class="vault-wrapper" id="vault">
        <h2>🔒 Хранилище</h2>
        
        <!-- Ninja Soccer o'yini o'zining GitHub sahifasida ochiladi -->
        <a href="https://behruzismoilov820.github.io/ninja-soccer/" target="_blank" class="app-btn" style="background: #10b981;">🥷 Ninja Soccer</a>
        
        <!-- Boshqa kuchli saytlar o'z saytida ochiladi -->
        <a href="https://play-cs.com/" target="_blank" class="app-btn" style="background: #334155;">🎮 CS 1.6 Web</a>
        <a href="https://yandex.com/games" target="_blank" class="app-btn" style="background: #fc3f1d;">🕹️ Yandex Games</a>
        <a href="https://www.google.com" target="_blank" class="app-btn" style="background: #2563eb;">🌐 Google</a>
        <a href="https://www.youtube.com" target="_blank" class="app-btn" style="background: #cc181e;">▶️ YouTube</a>
        <a href="https://github.com/behruzismoilov820" target="_blank" class="app-btn" style="background: #24292e;">🐙 GitHub</a>
        
        <button onclick="lockVault()" class="lock-btn">Заблокировать</button>
    </div>

    <script>
        const USER_PASSWORD = "1995"; 
        let display = document.getElementById('display');
        let calculator = document.getElementById('calculator');
        let vault = document.getElementById('vault');

        function press(val) { display.value += val; }
        function clearDisplay() { display.value = ""; }

        function calculate() {
            if (display.value === USER_PASSWORD) {
                calculator.style.display = 'none';
                vault.style.display = 'flex';
                clearDisplay();
                return;
            }
            try { display.value = eval(display.value); } catch (e) { display.value = "Ошибка"; }
        }

        function lockVault() {
            vault.style.display = 'none';
            calculator.style.display = 'block';
            clearDisplay();
        }
    </script>
</body>
</html>
